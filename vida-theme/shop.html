<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=El+Messiri:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<title>المتجر | VIDA فيدا</title>
<meta name="description" content="تسوّق مجوهرات فيدا الفضية: خواتم، قلائد، أقراط، أساور ومجموعة الرجال.">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow" style="color:#9ba0a8">Vida Collection</span>
      <h1 id="shop-title">كل المجوهرات</h1>
      <nav class="crumbs" aria-label="مسار التنقل"><a href="index.html">الرئيسية</a><span>/</span><span id="crumb-current">المتجر</span></nav>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container shop">
      <aside class="filters" aria-label="الفلاتر">
        <div class="filters__close" style="display:none;justify-content:space-between;align-items:center;margin-bottom:20px">
          <h3 style="font-size:22px">تصفية النتائج</h3>
          <button class="icon-btn" data-close-filters aria-label="إغلاق"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="filter-group">
          <h4>الفئة</h4>
          <div id="filter-cats"></div>
        </div>
        <div class="filter-group">
          <h4>السعر</h4>
          <input class="range" id="filter-price" type="range" min="150" max="700" step="10" value="700" aria-label="أعلى سعر">
          <div class="range-val"><span>150 ر.س</span><span id="price-max">700 ر.س</span></div>
        </div>
        <div class="filter-group">
          <h4>العروض</h4>
          <label class="check"><input type="checkbox" id="filter-sale"> المنتجات المخفّضة فقط</label>
        </div>
        <div class="filter-group" style="border:0;display:grid;gap:10px">
          <button class="btn btn--ghost btn--block" id="filters-reset">إعادة الضبط</button>
          <button class="btn btn--block filters-toggle" data-close-filters>عرض النتائج</button>
        </div>
      </aside>

      <div>
        <div class="toolbar">
          <button class="btn btn--ghost filters-toggle" id="filters-open" style="height:44px;padding:0 18px"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg> تصفية</button>
          <span class="toolbar__count" id="shop-count"></span>
          <select class="select" id="sort" aria-label="الترتيب">
            <option value="featured">الترتيب: المميز</option>
            <option value="new">الأحدث</option>
            <option value="rating">الأعلى تقييماً</option>
            <option value="low">السعر: من الأقل للأعلى</option>
            <option value="high">السعر: من الأعلى للأقل</option>
          </select>
        </div>
        <div class="grid grid--shop" id="shop-grid"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
