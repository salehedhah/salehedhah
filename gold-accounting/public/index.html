<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام محاسبة الذهب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="auth" class="auth hidden"></div>
  <div id="shell" class="shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span class="coin">◆</span> <span id="brandName">محاسبة الذهب</span></div>
      <nav id="nav"></nav>
      <div class="me"><span id="meName"></span><button class="link" id="logoutBtn">تسجيل الخروج</button></div>
    </aside>
    <main>
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
        <h1 id="pageTitle"></h1>
        <div class="gold-price" id="goldPrice"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
